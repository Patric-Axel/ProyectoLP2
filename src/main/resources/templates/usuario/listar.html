<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
<title>Getting Started: Serving Web Content</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

	<nav th:replace="~{layout/navbar :: navbar}"></nav>

	<div class="container mt-4">

		<!-- Título -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="fw-bold">👥 Gestión de Usuarios</h2>
		</div>
		<!-- Tabla -->
		<div class="card shadow-sm">

			<div class="card-header bg-dark text-white">Listado de Usuarios</div>
			<div class="card-body">
				<a th:href="@{/usuario/nuevo}" class="btn btn-success mb-3"> ➕
					Nuevo Usuario </a>
				</div>
				<div class="table-responsive">

					<table class="table table-hover table-bordered align-middle">

						<thead class="table-success">

							<tr>
								<th>ID</th>
								<th>Nombre</th>
								<th>Apellido</th>
								<th>Correo</th>
								<th>Contraseña</th>
								<th>Rol</th>
								<th>Estado</th>
								<th>Fecha de Registro</th>
								<th>Acciones</th>
							</tr>

						</thead>

						<tbody>

							<tr th:each="u : ${lstUsuarios}">

								<td th:text="${u.id_usuario}"></td>

								<td th:text="${u.nombre}"></td>

								<td th:text="${u.apellido}"></td>

								<td th:text="${u.correo}"></td>

								<td th:text="${u.contrasena}"></td>

								<td th:text="${u.objRol.nombre}"></td>

								<td th:text="${u.objEstado.descripcion}"></td>

								<td th:text="${u.fechaRegistro}"></td>

								<td><a th:href="@{/usuario/editar/}+${u.id_usuario}"
									class="btn btn-warning btn-sm"> ✏️ Editar </a></td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

	<footer th:replace="~{layout/footer :: footer}"></footer>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:if="${mensaje}">
Swal.fire({
    toast: true,
    position: 'top-end',
    icon: '[[${tipo}]]',
    title: '[[${mensaje}]]',
    showConfirmButton: false,
    timer: 3000,
    timerProgressBar: true
});
</script>
</body>
</html>
