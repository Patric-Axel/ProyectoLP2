<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
<meta charset="UTF-8">
<title>Registrar Usuario</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<nav th:replace="~{layout/navbar :: navbar}"></nav>

	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-7">

				<div class="card shadow-lg border-0">

					<div class="card-header bg-primary text-white">
						<h3 class="mb-0">👤 Registrar Usuario</h3>
					</div>

					<div class="card-body p-4">

						<form th:action="@{/usuario/guardar}" th:object="${usuario}"
							method="post">

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-bold"> Nombre </label> <input
										type="text" class="form-control" th:field="*{nombre}"
										placeholder="Ingrese el nombre" required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-bold"> Apellido </label> <input
										type="text" class="form-control" th:field="*{apellido}"
										placeholder="Ingrese el apellido" required>

								</div>

							</div>

							<div class="mb-3">

								<label class="form-label fw-bold"> Correo Electrónico </label> <input
									type="email" class="form-control" th:field="*{correo}"
									placeholder="correo@ejemplo.com" required>

							</div>

							<div class="mb-3">

								<label class="form-label fw-bold"> Contraseña </label> <input
									type="password" class="form-control" th:field="*{contrasena}"
									placeholder="Ingrese una contraseña" required>

							</div>

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-bold"> Rol </label> <select
										class="form-select" th:field="*{id_rol}">

										<option value="">Seleccione un rol</option>

										<option th:each="r : ${lstRoles}" th:value="${r.id_rol}"
											th:text="${r.nombre}"></option>

									</select>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-bold"> Estado </label> <input
										type="text" class="form-control bg-light" value="Activo"
										readonly>

								</div>

							</div>

							<div class="d-flex justify-content-between mt-4">

								<a th:href="@{/usuario/listar}" class="btn btn-secondary px-4">
									↩ Regresar </a>

								<button type="submit" class="btn btn-primary px-4">💾
									Guardar Usuario</button>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

	<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
