<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
<title>Getting Started: Serving Web Content</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

	<nav th:replace="~{layout/navbar :: navbar}"></nav>

	<div class="container mt-4">

		<!-- Título -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="fw-bold">🌿 Gestión de Productos</h2>
		</div>

		<!-- Reportes -->
		<div class="card shadow-sm mb-4">
			<div class="card-header bg-success text-white">Reportes</div>

			<div class="card-body">

				<a th:href="@{/reporteventas/pdf}" target="_blank"
					class="btn btn-danger me-2"> 📄 Reporte de Ventas </a> <a
					th:href="@{/reporteproductos/pdf}" target="_blank"
					class="btn btn-primary"> 📊 Productos Más Vendidos </a>

			</div>
		</div>

		<!-- Tabla -->
		<div class="card shadow-sm">

			<div class="card-header bg-dark text-white">Listado de
				Productos</div>

			<div class="card-body">
				<a th:href="@{/producto/nuevo}" class="btn btn-success mb-3"> ➕
					Nuevo Producto </a>
				<div class="table-responsive">

					<table class="table table-hover table-bordered align-middle">

						<thead class="table-success">

							<tr>
								<th>ID</th>
								<th>Nombre</th>
								<th>Descripción</th>
								<th>Precio</th>
								<th>Stock</th>
								<th>Estado</th>
								<th>Categoría</th>
								<th>Proveedor</th>
								<th>Acciones</th>
							</tr>

						</thead>

						<tbody>

							<tr th:each="p : ${lstProductos}">

								<td th:text="${p.id_producto}"></td>

								<td th:text="${p.nombre}"></td>

								<td th:text="${p.descripcion}"></td>

								<td>S/ <span th:text="${p.precio}"></span>
								</td>

								<td th:text="${p.cantidad}"></td>

								<td><span class="badge bg-success"
									th:if="${p.objEstadoProducto.descripcion == 'Activo'}">
										Activo </span> <span class="badge bg-secondary"
									th:unless="${p.objEstadoProducto.descripcion == 'Activo'}">
										Inactivo </span></td>

								<td th:text="${p.objCategoria.nom_categoria}"></td>

								<td th:text="${p.objProveedor.nom_proveedor}"></td>

								<td><a
									th:href="@{/producto/editar/{id}(id=${p.id_producto})}"
									class="btn btn-warning btn-sm"> ✏️ Editar </a></td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

	<footer th:replace="~{layout/footer :: footer}"></footer>

</body>
</html>
