<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
<meta charset="UTF-8">
<title>Editar Producto</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body class="bg-light">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark">
                    <h3 class="mb-0">✏️ Editar Producto</h3>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/producto/actualizar}"
                          th:object="${producto}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id_producto}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Nombre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   placeholder="Ingrese el nombre del producto"
                                   required>
                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Descripción
                            </label>

                            <textarea class="form-control"
                                      th:field="*{descripcion}"
                                      rows="3"
                                      placeholder="Ingrese una descripción"
                                      required></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Precio
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        S/
                                    </span>

                                    <input type="number"
                                           step="0.01"
                                           class="form-control"
                                           th:field="*{precio}"
                                           required>
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Stock
                                </label>

                                <input type="number"
                                       class="form-control"
                                       th:field="*{cantidad}"
                                       required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Estado
                                </label>

                                <select class="form-select"
                                        th:field="*{idestado}">

                                    <option th:each="e : ${lstEstados}"
                                            th:value="${e.idestado}"
                                            th:text="${e.descripcion}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">
                                    Categoría
                                </label>

                                <select class="form-select"
                                        th:field="*{id_categoria}">

                                    <option th:each="c : ${lstCategorias}"
                                            th:value="${c.id_categoria}"
                                            th:text="${c.nom_categoria}">
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Proveedor
                            </label>

                            <select class="form-select"
                                    th:field="*{id_proveedor}">

                                <option th:each="p : ${lstProveedores}"
                                        th:value="${p.id_proveedor}"
                                        th:text="${p.nom_proveedor}">
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/producto/listar}"
                               class="btn btn-secondary px-4">
                                ↩ Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-warning px-4">
                                💾 Actualizar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
<footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
